<div class="para" id="fig-graphfigurecpp-2-2-1">This graph visually compares the growth rates of several common Big-O functions as the input size, <span class="process-math">\(n\text{,}\)</span> increases. The functions plotted include constant (<span class="process-math">\(O(1)\)</span>), logarithmic (<span class="process-math">\(O(\log n)\)</span>), linear (<span class="process-math">\(O(n)\)</span>), log-linear (<span class="process-math">\(O(n \log n)\)</span>), quadratic (<span class="process-math">\(O(n^2)\)</span>), cubic (<span class="process-math">\(O(n^3)\)</span>), and exponential (<span class="process-math">\(O(2^n)\)</span>).<div class="autopermalink" data-description="Paragraph"><a href="#fig-graphfigurecpp-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="fig-graphfigurecpp-2-2-2">The x-axis represents <span class="process-math">\(n\)</span> (input size), and the y-axis represents the number of operations or time. For small values of <span class="process-math">\(n\text{,}\)</span> the differences between some functions may not be pronounced. However, as <span class="process-math">\(n\)</span> grows larger, the graph clearly illustrates how functions with higher orders of magnitude (like exponential and cubic) increase much more rapidly than those with lower orders (like logarithmic and linear), demonstrating their comparative efficiency for large inputs.<div class="autopermalink" data-description="Paragraph"><a href="#fig-graphfigurecpp-2-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
