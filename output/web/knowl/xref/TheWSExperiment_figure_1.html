<img src="external/SmallWorldGraphs/Figures/thinkcomplexity2009.png" class="contained" alt="Normalized clustering (C) and path length (L) vs. rewiring probability (p) for Watts-Strogatz graphs."><details class="image-description" aria-live="polite"><summary title="details"><span class="icon material-symbols-outlined" aria-hidden="true">&#xe88e;</span></summary><div id="TheWSExperiment_figure_1-2-description">
<div class="para" id="TheWSExperiment_figure_1-2-2-1">This line graph, titled "Normalized clustering coefficient and path length," shows how these metrics change for Watts-Strogatz (WS) graphs (<span class="process-math">\(n=1000\)</span> nodes, <span class="process-math">\(k=10\)</span> initial connectivity) as rewiring probability (<span class="process-math">\(p\)</span>) varies.<div class="autopermalink" data-description="Paragraph"><a href="#TheWSExperiment_figure_1-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="TheWSExperiment_figure_1-2-2-2">The x-axis, "Rewiring probability (p)", is logarithmic (<span class="process-math">\(10^{-4}\)</span> to <span class="process-math">\(10^0\)</span>). The y-axis shows normalized values (0.0 to 1.0) for both C and L.<div class="autopermalink" data-description="Paragraph"><a href="#TheWSExperiment_figure_1-2-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="TheWSExperiment_figure_1-2-2-3">Two curves are shown:<div class="autopermalink" data-description="Paragraph"><a href="#TheWSExperiment_figure_1-2-2-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="TheWSExperiment_figure_1-2-2-4">Normalized Clustering Coefficient (<span class="process-math">\(C(p)/C(0)\)</span>): (Dark blue squares) Starts at 1.0, stays high until <span class="process-math">\(p \approx 10^{-2}\text{,}\)</span> then drops sharply towards 0 as <span class="process-math">\(p\)</span> approaches <span class="process-math">\(10^0\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#TheWSExperiment_figure_1-2-2-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="TheWSExperiment_figure_1-2-2-5">Normalized Characteristic Path Length (<span class="process-math">\(L(p)/L(0)\)</span>): (Light blue circles) Also starts at 1.0, but drops much earlier and faster, beginning its steep decline around <span class="process-math">\(p=10^{-4}\)</span> to <span class="process-math">\(10^{-3}\)</span> and stabilizing at a low value by <span class="process-math">\(p \approx 10^{-1}\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#TheWSExperiment_figure_1-2-2-5" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="TheWSExperiment_figure_1-2-2-6">The graph illustrates the "small-world" phenomenon: a region (around <span class="process-math">\(p \approx 10^{-3}\)</span> to <span class="process-math">\(10^{-1}\)</span>) where path length (<span class="process-math">\(L\)</span>) is low (like random graphs) while clustering (<span class="process-math">\(C\)</span>) remains high (like regular lattices), indicating highly clustered networks with short average path lengths.<div class="autopermalink" data-description="Paragraph"><a href="#TheWSExperiment_figure_1-2-2-6" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
