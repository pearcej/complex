<div class="para" id="sfn-fig-5-2-2-1">This figure illustrates the Complementary Cumulative Distribution Functions (CCDFs) of node degrees, comparing the Facebook dataset with the Watts-Strogatz (WS) and Barabási-Albert (BA) models. The plot uses a log-log scale, meaning both the x-axis (degree) and the y-axis (complementary cumulative probability, 1-CDF) are logarithmically scaled. The presentation involves two panels or subplots as described in the caption.<div class="autopermalink" data-description="Paragraph"><a href="#sfn-fig-5-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="sfn-fig-5-2-2-2">The left panel is dedicated to comparing the CCDF of the Facebook dataset with that of the WS model. The right panel contrasts the Facebook dataset’s CCDF with the BA model’s CCDF. Such log-log plots of CCDFs are particularly effective for examining the tail behavior of distributions and identifying power-law characteristics, which are discussed in the accompanying text based on these visualizations.<div class="autopermalink" data-description="Paragraph"><a href="#sfn-fig-5-2-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
