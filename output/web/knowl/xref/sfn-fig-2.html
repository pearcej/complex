</div> 
<div class="para" id="sfn-fig-2-2-2-2">The change to a log-log scale significantly alters the visual representation of these distributions. The WS model’s distribution typically remains compact, while the tail of the Facebook dataset’s distribution is emphasized. The accompanying text discusses how this transformation can reveal underlying patterns, such as the appearance of a nearly straight line for the Facebook data, which is indicative of a power-law relationship explained in the text.<div class="autopermalink" data-description="Paragraph"><a href="#sfn-fig-2-2-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
