<div class="para" id="fig-graphfigure2cpp-2-2-1">This graph provides a visual comparison of a specific function, <span class="process-math">\(T(n) = 3n^2+2n+4\text{,}\)</span> with several common Big-O functions, specifically <span class="process-math">\(O(n)\)</span> (linear), <span class="process-math">\(O(n^2)\)</span> (quadratic), and <span class="process-math">\(O(n^3)\)</span> (cubic). The x-axis represents the input size <span class="process-math">\(n\text{,}\)</span> and the y-axis represents the value of the functions (e.g., number of operations).<div class="autopermalink" data-description="Paragraph"><a href="#fig-graphfigure2cpp-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="fig-graphfigure2cpp-2-2-2">The plot illustrates how for small values of <span class="process-math">\(n\text{,}\)</span> the <span class="process-math">\(T(n)\)</span> function might initially appear larger than even the <span class="process-math">\(O(n^3)\)</span> curve due to constants and lower-order terms. However, as <span class="process-math">\(n\)</span> increases, the dominant <span class="process-math">\(n^2\)</span> term in <span class="process-math">\(T(n)\)</span> dictates its growth. The graph shows <span class="process-math">\(T(n)\)</span> growing faster than <span class="process-math">\(O(n)\)</span> and eventually aligning closely with the growth rate of <span class="process-math">\(O(n^2)\text{,}\)</span> while the <span class="process-math">\(O(n^3)\)</span> function grows much more rapidly and overtakes <span class="process-math">\(T(n)\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#fig-graphfigure2cpp-2-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
